
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="description" content="Z Platform - Upload and deploy your website easily.">
<title>_ Z Platform</title>
<style>
:root{--bg:#08080c;--card:#14141c;--pink:#ec4899;--muted:#a1a1aa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:white;font-family:Segoe UI,system-ui,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0}
header{height:75px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}
.logo{font-size:27px;font-weight:900}
.status{font-size:13px;color:#86efac}
main{min-height:calc(100vh - 75px);display:flex;align-items:center;flex-direction:column;padding:40px 18px}
.welcome{text-align:center;margin-bottom:30px}
h1{font-size:clamp(25px,5vw,38px);font-weight:850}
.welcome p{color:var(--muted);margin-top:10px}
.upload-area{width:min(300px,85vw);aspect-ratio:1;border:2px dashed #ec489980;border-radius:50%;background:radial-gradient(circle,#291425,#14141c 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:25px;transition:.25s}
.upload-area:hover{border-color:var(--pink);transform:scale(1.02)}
.symbol{font-size:45px;color:var(--pink)}
.upload-area strong{font-size:17px}
.upload-area small{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:min(450px,100%);margin-top:22px}
.action{padding:13px 18px;border-radius:11px;background:#191923;color:white;border:1px solid #ec489966;flex:1;min-width:145px;font-weight:700}
.primary,.deploy{background:var(--pink);color:white}
.preview,.result{width:min(450px,100%);margin-top:22px;padding:18px;border:1px solid #ffffff18;border-radius:15px;background:var(--card)}
.preview{display:flex;align-items:center;justify-content:space-between;gap:12px}
.preview[hidden],.result[hidden]{display:none}
.project-info{min-width:0}
.project-info small{color:var(--muted);display:block;margin-bottom:6px}
.project-info strong{overflow-wrap:anywhere}
.deploy{padding:12px 20px;border-radius:10px;font-weight:800}
button:disabled{opacity:.5;cursor:not-allowed}
.result{text-align:center;border-color:var(--pink)}
.result p{margin:12px 0;color:#86efac}
.url-box{display:flex;gap:8px;margin-top:15px}
.url-box input{min-width:0;flex:1;padding:11px;background:#090910;color:#f9a8d4;border:1px solid #ffffff20;border-radius:8px}
.url-box button,.open-link{padding:11px 14px;background:var(--pink);color:white;border-radius:8px;font-weight:700}
.open-link{display:inline-block;text-decoration:none;margin-top:12px}
#message{color:var(--muted);margin-top:18px;text-align:center;max-width:450px;overflow-wrap:anywhere}
.progress{width:min(450px,100%);height:5px;margin-top:18px;background:#252530;border-radius:10px;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:var(--pink);transition:width .3s}
footer{padding:25px;text-align:center;color:#71717a;font-size:12px}
[hidden]{display:none!important}
@media(max-width:480px){header{padding:15px}.preview{align-items:flex-start;flex-direction:column}.deploy{width:100%}}
</style>
</head>
<body>

<header>
<span class="logo">_ Z</span>
<span class="status">● Platform Ready</span>
</header>

<main>
<section class="welcome">
<h1>Ready when you are, Ziad.</h1>
<p>Upload your project and deploy it.</p>
</section>

<div class="upload-area">
<span class="symbol">↑</span>
<strong>Upload your project</strong>
<small>Choose a folder or multiple files</small>
</div>

<div class="actions">
<button class="action primary" id="folderBtn">📁 Browse Folder</button>
<button class="action" id="filesBtn">📄 Choose Multiple Files</button>
</div>

<input id="folderInput" type="file" webkitdirectory multiple hidden>
<input id="filesInput" type="file" multiple hidden>

<section class="preview" id="preview" hidden>
<div class="project-info">
<small>SELECTED PROJECT</small>
<strong id="projectName"></strong>
<small id="fileCount"></small>
</div>
<button class="deploy" id="deployBtn">Deploy Now</button>
</section>

<div class="progress" id="progress" hidden>
<span id="progressBar"></span>
</div>

<p id="message">Choose your project to get started.</p>

<section class="result" id="result" hidden>
<h3>🎉 Deployment Successful!</h3>
<p>Your website is live.</p>
<div class="url-box">
<input id="siteUrl" readonly>
<button id="copyBtn">Copy</button>
</div>
<a id="openBtn" class="open-link" target="_blank" rel="noopener">Open Website ↗</a>
</section>
</main>

<footer>Built by Ziad · _ Z Platform</footer>

<script>
const $ = id => document.getElementById(id);
let selectedFiles = [];

$("folderBtn").onclick = () => $("folderInput").click();
$("filesBtn").onclick = () => $("filesInput").click();

$("folderInput").onchange = e => selectFiles(e.target.files,true);
$("filesInput").onchange = e => selectFiles(e.target.files,false);

function selectFiles(files,isFolder){
  if(!files.length)return;

  selectedFiles=Array.from(files);
  $("preview").hidden=false;
  $("result").hidden=true;

  $("projectName").textContent=isFolder
    ? selectedFiles[0].webkitRelativePath.split("/")[0]
    : selectedFiles[0].name;

  $("fileCount").textContent=selectedFiles.length+" files selected";
  $("message").textContent="Your project is ready to deploy.";
}

function readBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(",")[1]);
    reader.onerror=()=>reject(new Error("Could not read file."));
    reader.readAsDataURL(file);
  });
}

$("deployBtn").onclick=async()=>{
  if(!selectedFiles.length)return;

  const btn=$("deployBtn");
  btn.disabled=true;
  btn.textContent="Deploying...";
  $("result").hidden=true;
  $("progress").hidden=false;

  try{
    const files=[];
    const root=selectedFiles[0].webkitRelativePath
      ? selectedFiles[0].webkitRelativePath.split("/")[0]
      : null;

    for(let i=0;i<selectedFiles.length;i++){
      const file=selectedFiles[i];
      let filePath=file.webkitRelativePath||file.name;

      if(root && filePath.startsWith(root+"/")){
        filePath=filePath.slice(root.length+1);
      }

      filePath=filePath.replace(/\\/g,"/");

      files.push({
        file:filePath,
        data:await readBase64(file),
        encoding:"base64"
      });

      $("progressBar").style.width=
        Math.round((i+1)/selectedFiles.length*65)+"%";

      $("message").textContent=
        `Preparing files ${i+1}/${selectedFiles.length}`;
    }

    if(!files.some(f=>f.file==="index.html")){
      throw new Error("index.html must be in the main project folder.");
    }

    $("message").textContent="Sending project to Vercel...";
    $("progressBar").style.width="75%";

    const response=await fetch("/api/deploy",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        files,
        name:$("projectName").textContent
      })
    });

    const data=await response.json();

    if(!response.ok)throw new Error(data.error||"Deployment failed.");
    if(!data.url)throw new Error("No website URL received.");

    $("siteUrl").value=data.url;
    $("openBtn").href=data.url;
    $("result").hidden=false;
    $("progressBar").style.width="100%";
    $("message").textContent="Your website is online!";

  }catch(error){
    $("message").textContent="Error: "+error.message;
  }finally{
    btn.disabled=false;
    btn.textContent="Deploy Now";
    $("progress").hidden=true;
  }
};

$("copyBtn").onclick=async()=>{
  try{
    await navigator.clipboard.writeText($("siteUrl").value);
    $("copyBtn").textContent="Copied!";
  }catch{
    $("siteUrl").select();
    document.execCommand("copy");
  }
};
</script>
</body>
</html>

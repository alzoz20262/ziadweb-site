<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>_ Z Platform</title>  

<style>  
    :root {  
        --bg: #08080c;  
        --card: #14141c;  
        --pink: #ec4899;  
        --white: #ffffff;  
        --muted: #a1a1aa;  
        --border: rgba(255,255,255,.08);  
    }  

    * { margin: 0; padding: 0; box-sizing: border-box; }  
    body { background: var(--bg); color: #f5f5f7; font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }  
    button, input { font: inherit; }  
    button { border: 0; cursor: pointer; }  

    .splash-screen {  
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;  
        background: radial-gradient(circle at center, rgba(236,72,153,.16), transparent 45%), var(--bg);  
        transition: opacity .7s ease, visibility .7s ease;  
    }  
    .splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }  
    .brand-logo { color: white; font-size: clamp(4.5rem,15vw,9rem); font-weight: 900; letter-spacing: -.08em; text-shadow: 0 0 25px rgba(236,72,153,.25); }  
    .splash-text { margin-top: 18px; color: var(--muted); text-align: center; }  

    .main-screen { min-height: 100vh; display: flex; flex-direction: column; }  
    .top-bar { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border); }  
    .small-logo { font-size: 1.5rem; font-weight: 900; }  
    .user-status { display: flex; align-items: center; gap: 12px; }  
    .user-email { color: var(--pink); font-size: .9rem; font-weight: 600; }  
    .login-button { padding: 11px 22px; color: white; background: rgba(236,72,153,.12); border: 1px solid rgba(236,72,153,.35); border-radius: 12px; }  

    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }  
    .welcome-section { text-align: center; margin-bottom: 25px; }  
    .welcome-section h1 { font-size: clamp(1.7rem,4vw,2.7rem); font-weight: 800; }  
    .welcome-section p { margin-top: 8px; color: var(--muted); }  

    .upload-area {  
        width: min(300px,80vw); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;  
        gap: 10px; padding: 20px; text-align: center; border-radius: 50%;  
        background: radial-gradient(circle at center, rgba(236,72,153,.08), rgba(20,20,28,.95) 70%);  
        border: 2px dashed rgba(236,72,153,.45); transition: .3s;  
    }  
    .upload-text-btn { color: white; font-weight: 700; font-size: 1rem; cursor: pointer; padding: 6px 12px; border-radius: 6px; }  
    .upload-text-btn:hover { color: var(--pink); background: rgba(255,255,255,0.05); }  
    .upload-text-or { color: var(--muted); font-size: .85rem; }  

    .project-preview, .deploy-result {  
        width: min(450px,92vw); margin-top: 25px; padding: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 16px;  
    }  
    .project-preview { display: flex; align-items: center; justify-content: space-between; gap: 15px; }  
    .project-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }  
    .project-label { color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; }  
    .project-name { color: white; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  

    .deploy-button { padding: 12px 26px; color: white; background: var(--pink); border-radius: 12px; font-weight: 800; white-space: nowrap; }  
    .deploy-button:disabled { opacity: .6; cursor: not-allowed; }  

    .deploy-result { text-align: center; border-color: var(--pink); }  
    .success-message { color: #86efac; font-weight: 800; margin-bottom: 12px; }  
    .url-box { display: flex; gap: 8px; }  
    .url-input { flex: 1; min-width: 0; padding: 10px; color: var(--pink); background: #181824; border: 1px solid var(--border); border-radius: 8px; outline: none; }  
    .copy-btn { padding: 10px 14px; color: white; background: var(--pink); border-radius: 8px; font-weight: 700; }  

    .modal { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }  
    .modal[hidden] { display: none !important; }  
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); }  
    .login-card { width: min(380px,100%); position: relative; z-index: 1; padding: 30px; text-align: center; background: #121219; border: 1px solid var(--border); border-radius: 20px; }  
    .close-button { position: absolute; top: 12px; right: 15px; color: var(--muted); background: transparent; font-size: 1.5rem; cursor: pointer; }  
    .auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }  
    .auth-input { width: 100%; padding: 12px; color: white; background: #1a1a24; border: 1px solid var(--border); border-radius: 8px; outline: none; }  
    .auth-submit, .google-login-button { width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; }  
    .auth-submit { color: white; background: var(--pink); }  
    .google-login-button { display: flex; align-items: center; justify-content: center; gap: 10px; color: #18181b; background: white; margin-top: 10px; }  
</style>  
</head>  
<body>  

<section id="splash-screen" class="splash-screen">  
    <div>  
        <div class="brand-logo">_ Z</div>  
        <p class="splash-text">Built by Ziad. Powered by Firebase.</p>  
    </div>  
</section>  

<main class="main-screen">  
    <header class="top-bar">  
        <span class="small-logo">_ Z</span>  
        <div class="user-status">  
            <span id="user-display" class="user-email"></span>  
            <button id="login-button" class="login-button">Sign in</button>  
        </div>  
    </header>  

    <section class="main-content">  
        <div class="welcome-section">  
            <h1>Ready when you are, Ziad.</h1>  
            <p>Upload your project and deploy it.</p>  
        </div>  

        <input type="file" id="folder-input" webkitdirectory directory style="display: none;">  
        <input type="file" id="file-input" multiple style="display: none;">  

        <div id="upload-area" class="upload-area">  
            <span id="btn-browse-folder" class="upload-text-btn">Browse folder to upload</span>  
            <span class="upload-text-or">or</span>  
            <span id="btn-browse-files" class="upload-text-btn">choose multiple files</span>  
        </div>  

        <section id="project-preview" class="project-preview" style="display: none;">  
            <div class="project-info">  
                <span class="project-label">SELECTED PROJECT</span>  
                <span id="project-name" class="project-name">No files selected</span>  
            </div>  
            <button id="deploy-button" class="deploy-button">Deploy</button>  
        </section>  

        <section id="deploy-result" class="deploy-result" style="display: none;">  
            <p class="success-message">✓ Project Deployed Successfully!</p>  
            <div class="url-box">  
                <input type="text" id="deployed-url" class="url-input" readonly>  
                <button id="copy-btn" class="copy-btn">Copy</button>  
            </div>  
        </section>  
    </section>  
</main>  

<div id="auth-modal" class="modal" hidden>  
    <div class="modal-overlay" id="modal-overlay"></div>  
    <div class="login-card">  
        <button id="close-modal" class="close-button">&times;</button>  
        <h2>Sign In Required</h2>  
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 5px;">Please login to deploy your project.</p>  
        <form id="login-form" class="auth-form">  
            <input type="email" id="email-input" class="auth-input" placeholder="Email address" required>  
            <button type="submit" class="auth-submit">Sign In with Email</button>  
        </form>  
        <button id="google-btn" class="google-login-button">Sign In with Google</button>  
    </div>  
</div>  

<script>
    // تفعيل إخفاء الشاشة الفوري بمجرد تحميل الصفحة
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) splash.classList.add('hide');
        }, 2000);
    });

    let currentUser = null;
    let selectedFiles = [];

    const folderInput = document.getElementById('folder-input');
    const fileInput = document.getElementById('file-input');
    const btnFolder = document.getElementById('btn-browse-folder');
    const btnFiles = document.getElementById('btn-browse-files');
    const projectPreview = document.getElementById('project-preview');
    const projectName = document.getElementById('project-name');
    const deployBtn = document.getElementById('deploy-button');
    const deployResult = document.getElementById('deploy-result');
    const deployedUrl = document.getElementById('deployed-url');
    const copyBtn = document.getElementById('copy-btn');

    const loginBtn = document.getElementById('login-button');
    const authModal = document.getElementById('auth-modal');
    const closeModal = document.getElementById('close-modal');
    const modalOverlay = document.getElementById('modal-overlay');
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email-input');
    const userDisplay = document.getElementById('user-display');
    const googleBtn = document.getElementById('google-btn');

    btnFolder.addEventListener('click', () => folderInput.click());
    btnFiles.addEventListener('click', () => fileInput.click());

    folderInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFiles = e.target.files;
            const folderName = selectedFiles[0].webkitRelativePath.split('/')[0] || 'Selected Folder';
            projectName.textContent = `Folder: ${folderName} (${selectedFiles.length} files)`;
            projectPreview.style.display = 'flex';
            deployResult.style.display = 'none';
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFiles = e.target.files;
            projectName.textContent = selectedFiles.length === 1 ? selectedFiles[0].name : `${selectedFiles.length} files selected`;
            projectPreview.style.display = 'flex';
            deployResult.style.display = 'none';
        }
    });

    const openAuth = () => authModal.removeAttribute('hidden');
    const closeAuth = () => authModal.setAttribute('hidden', 'true');

    loginBtn.addEventListener('click', () => {
        if (currentUser) {
            currentUser = null;
            userDisplay.textContent = '';
            loginBtn.textContent = 'Sign in';
        } else {
            openAuth();
        }
    });

    closeModal.addEventListener('click', closeAuth);
    modalOverlay.addEventListener('click', closeAuth);

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        currentUser = emailInput.value;
        userDisplay.textContent = currentUser;
        loginBtn.textContent = 'Sign out';
        closeAuth();
    });

    googleBtn.addEventListener('click', () => {
        currentUser = "ziad@gmail.com";
        userDisplay.textContent = currentUser;
        loginBtn.textContent = 'Sign out';
        closeAuth();
    });

    deployBtn.addEventListener('click', () => {
        if (!currentUser) {
            alert('يجب عليك تسجيل الدخول أولاً لتتمكن من النشر!');
            openAuth();
            return;
        }

        if (selectedFiles.length === 0) {
            alert('الرجاء اختيار ملفات أو مجلد أولاً!');
            return;
        }

        deployBtn.textContent = 'Deploying...';
        deployBtn.disabled = true;

        setTimeout(() => {
            deployBtn.textContent = 'Deploy';
            deployBtn.disabled = false;
            
            const siteName = (projectName.textContent.split(':')[1] || 'project').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const generatedLink = `https://${siteName || 'site'}-${Math.floor(1000 + Math.random() * 9000)}.vercel.app`;
            
            deployedUrl.value = generatedLink;
            deployResult.style.display = 'block';
        }, 2000);
    });

    copyBtn.addEventListener('click', () => {
        deployedUrl.select();
        navigator.clipboard.writeText(deployedUrl.value);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 2000);
    });
</script>

</body>  
</html>
